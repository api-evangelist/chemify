aid: chemify
name: Chemify
description: Chemify is a Glasgow-based programmable-chemistry company, spun out of the University of
  Glasgow in 2022 by chemist Lee Cronin, that digitizes the creation of molecules through what it calls
  "Chemputation." The platform fuses AI/ML-driven molecular design, a universal chemical programming
  language, and robotic synthesis so pharmaceutical, biotech, and industrial partners can move from a
  novel concept to a makeable compound end to end. In 2025 Chemify opened its first Chemifarm, a fully
  automated chemistry facility in Glasgow's Maryhill district that pairs its molecular-design engine
  with industrial-scale robotic synthesis, and closed a $50M Series B co-led by Wing Venture Capital and
  Insight Partners, with backing from DCVC. Chemify does not currently publish a public developer API,
  documentation, or SDKs; engagement runs through its partner program.
